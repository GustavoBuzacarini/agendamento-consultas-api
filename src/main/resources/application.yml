server:
  port: ${SERVER_PORT:8081}   # 8080 costuma estar ocupada por outros serviços locais

spring:
  application:
    name: agendamento-consultas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendamento}
    username: ${DB_USER:agendamento}
    password: ${DB_PASSWORD}   # sem valor padrão: vem do ambiente (constituição P-002)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

# Serviço de consulta de CEP (US-006)
cep:
  viacep:
    url: ${VIACEP_URL:https://viacep.com.br/ws}

# Regras de agendamento (ASM-006): configuráveis sem recompilar
agendamento:
  antecedencia-minima-horas: 2
  limite-consultas-futuras: 2
