server:
  port: ${SERVER_PORT:8081}   # 8080 costuma estar ocupada por outros serviços locais

spring:
  application:
    name: agendamento-consultas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendamento}
    username: ${DB_USER:agendamento}
    password: ${DB_PASSWORD}   # sem valor padrão: vem do ambiente (constituição P-002)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

# Token de acesso (fase 2). O segredo vem só do ambiente: sem ele (ou com menos de 32 caracteres),
# a aplicação se recusa a iniciar.
seguranca:
  jwt:
    segredo: ${JWT_SECRET:}
    validade: 1h

# Documentação da API (OpenAPI/Swagger UI). Fechada por padrão: exige token como o resto da API.
# Com DOCUMENTACAO_ABERTA=true, só os endereços da documentação abrem sem token. Use apenas em
# ambiente local; deixe desligada em qualquer ambiente exposto.
documentacao:
  aberta: ${DOCUMENTACAO_ABERTA:false}

# Conta inicial da recepção: criada na primeira subida, só se ainda não existir conta de recepção.
recepcao:
  inicial:
    usuario: ${RECEPCAO_USUARIO_INICIAL:}
    senha: ${RECEPCAO_SENHA_INICIAL:}

# Serviço de consulta de CEP (US-006)
cep:
  viacep:
    url: ${VIACEP_URL:https://viacep.com.br/ws}

# Regras de agendamento (ASM-006): configuráveis sem recompilar
agendamento:
  antecedencia-minima-horas: 2
  limite-consultas-futuras: 2
